# CI: lint + Django test suite (manage.py test) against a real PostgreSQL
# service — the project settings are PostgreSQL-only, and plain `pytest`
# without pytest-django would silently collect zero Django tests.

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nusantartrans
          POSTGRES_USER: nusantar
          POSTGRES_PASSWORD: nusantar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nusantar -d nusantartrans"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      POSTGRES_DB: nusantartrans
      POSTGRES_USER: nusantar
      POSTGRES_PASSWORD: nusantar
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with Django test runner
      run: |
        python manage.py check
        python manage.py test --verbosity=2
