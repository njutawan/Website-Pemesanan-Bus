[project]
name = "nusantara-trans"
version = "1.1.0"
description = "Nusantara Trans — Website Pemesanan Tiket Bus & Rental Mobil (Django + PostgreSQL + Bootstrap 5)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "njutawan", email = "61883069+njutawan@users.noreply.github.com" }]
keywords = ["booking-system", "bus-booking", "car-rental", "django", "qris", "seo"]
classifiers = [
  "Framework :: Django",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "Django>=6.1.2,<6.2",
  "Pillow>=13.0.0",
  "gunicorn>=26.2.0",
  "whitenoise>=6.12.0",
  "psycopg[binary]>=3.3.6",
  "django-compressor>=4.6.0",
  "redis>=8.1.0",
  "polib>=1.2.0",
  "bcrypt>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/njutawan/Website-Pemesanan-Bus"
Changelog = "https://github.com/njutawan/Website-Pemesanan-Bus/blob/main/CHANGELOG.md"
Repository = "https://github.com/njutawan/Website-Pemesanan-Bus"
Issues = "https://github.com/njutawan/Website-Pemesanan-Bus/issues"

[tool.setuptools.packages.find]
include = ["booking", "core", "rental"]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"
