# =============================================================================
# Nginx reverse proxy — Website Pemesanan Tiket Bus & Rental Mobil
# (Django + Gunicorn)
#
# Standar URL: HTTPS + TANPA www (apex). Ketiga blok di bawah memastikan
# hanya SATU URL kanonik per halaman (301 permanen, SEO-friendly):
#   1. http://  -> https://            (apapun host-nya)
#   2. https://www -> https:// (apex)
#   3. server utama melayani https://nusantartrans.example
#
# Keamanan di lapisan ini (berlapis dengan Django):
#   * HSTS, X-Frame-Options DENY, nosniff, Referrer-Policy, Permissions-Policy
#   * TLS 1.2/1.3 saja, session tickets off
#   * limit_req/limit_conn per IP (login admin, form, umum)
#   * source map (*.map) selalu 404
#   * media hanya ekstensi gambar; PHP/HTML/SVG/JS tidak pernah disajikan
#   * access log menyamarkan kode booking di URL
#
# Pasang:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/nusantartrans
#   sudo ln -s /etc/nginx/sites-available/nusantartrans /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d nusantartrans.example -d www.nusantartrans.example
#   sudo nginx -t && sudo systemctl reload nginx
#
# Jalankan aplikasi (Gunicorn):
#   cd /var/www/website-pemesanan-bus
#   python -m venv .venv && source .venv/bin/activate
#   pip install -r requirements.txt
#   python manage.py migrate && python manage.py compile_i18n
#   python manage.py collectstatic --noinput
#   DJANGO_DEBUG=0 python manage.py compress --force
#   gunicorn core.wsgi:application --bind 127.0.0.1:8001 --workers 3
# =============================================================================

upstream nusantartrans_app {
    server 127.0.0.1:8001;
}

# ---- Rate limit (per IP; hanya POST untuk endpoint form) ----
map $request_method $nt_post_key {
    default "";
    POST    $binary_remote_addr;
}

limit_req_zone  $binary_remote_addr zone=nt_general:10m rate=20r/s;
limit_req_zone  $nt_post_key        zone=nt_forms:10m   rate=20r/m;
limit_req_zone  $nt_post_key        zone=nt_login:10m   rate=5r/m;
limit_conn_zone $binary_remote_addr zone=nt_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# ---- Access log tanpa kode booking (kredensial pemilik halaman) ----
map $request_uri $nt_safe_uri {
    default $request_uri;
    ~^(.*/bus/booking/)[^/?]+    $1[REDACTED];
    ~^(.*/rental/sewa/)[^/?]+    $1[REDACTED];
}
log_format nt_safe '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $nt_safe_uri $server_protocol" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
access_log /var/log/nginx/nusantartrans.access.log nt_safe;
error_log  /var/log/nginx/nusantartrans.error.log warn;

# -----------------------------------------------------------------------------
# 1) HTTP -> HTTPS (redirect permanen)
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name nusantartrans.example www.nusantartrans.example;  # ganti domain Anda

    server_tokens off;

    # ACME challenge untuk Let's Encrypt tetap lewat HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    return 301 https://nusantartrans.example$request_uri;
}

# -----------------------------------------------------------------------------
# 2) www -> apex (standar domain: tanpa www)
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.nusantartrans.example;

    server_tokens off;
    ssl_certificate     /etc/letsencrypt/live/nusantartrans.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nusantartrans.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://nusantartrans.example$request_uri;
}

# -----------------------------------------------------------------------------
# 3) Server utama — apex, HTTPS
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nusantartrans.example;

    server_tokens off;
    ssl_certificate     /etc/letsencrypt/live/nusantartrans.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nusantartrans.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Keamanan header (HSTS — browser mengingat versi HTTPS selamanya)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # ===== Core Web Vitals: kompresi & caching =====
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/woff2;
    gzip_min_length 512;
    open_file_cache max=1000 inactive=1h;

    client_max_body_size 10M;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 20s;
    keepalive_timeout 30s;
    limit_conn nt_conn 30;

    # Source map TIDAK PERNAH disajikan (juga diblokir middleware Django).
    location ~* \.map$ {
        return 404;
    }

    # ---------- Berkas statik (WhiteNoise collectstatic: .gz siap pakai) ----------
    location /static/ {
        alias /var/www/website-pemesanan-bus/staticfiles/;
        autoindex off;
        gzip_static on;          # sajikan berkas .gz hasil collectstatic
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        access_log off;
    }

    # ---------- Bukti pembayaran (PRIVAT — JANGAN sajikan dari disk) ----------
    # Berisi data pribadi/nomor rekening: teruskan ke Django
    # (core.private_media.serve_media) yang hanya mengizinkan staf atau
    # sesi pemilik bookingnya. Location regex ini menang atas prefix
    # /media/ di bawah untuk kedua awalan privat tersebut.
    location ~ ^/media/(payment_proofs|rental_proofs)/ {
        proxy_pass http://nusantartrans_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # timpa, jangan append header kiriman klien
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }

    # ---------- Tolak berkas aktif di media (walau ada yang lolos upload) ----------
    location ~* ^/media/.*\.(php|phtml|phar|html?|xhtml|js|mjs|svg|xml|json|map|css)$ {
        return 404;
    }

    # ---------- Media unggahan publik (foto mobil & OG image) ----------
    location /media/ {
        alias /var/www/website-pemesanan-bus/media/;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public";
        # Unggahan internal tidak untuk mesin pencari (selaras middleware Django)
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        access_log off;
    }

    # ---------- Login admin: 5 POST/menit per IP + burst kecil ----------
    location = /admin/login/ {
        limit_req zone=nt_login burst=3 nodelay;
        proxy_pass http://nusantartrans_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # timpa, jangan append header kiriman klien
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }

    # ---------- Cek booking & form pemesanan: 20 POST/menit ----------
    location = /bus/cek-booking/ {
        limit_req zone=nt_forms burst=5 nodelay;
        proxy_pass http://nusantartrans_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # timpa, jangan append header kiriman klien
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }

    # ---------- Aplikasi Django ----------
    location / {
        limit_req zone=nt_general burst=60 nodelay;
        proxy_pass http://nusantartrans_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # timpa, jangan append header kiriman klien
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }

    # ---------- Berkas yang tidak perlu di-expose ----------
    location ~ /\.(?!well-known) {
        deny all;
    }
}
