# =============================================================================
# Nginx reverse proxy — Website Pemesanan Tiket Bus & Rental Mobil
# (Django + Gunicorn)
#
# Pasang:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/nusantartrans
#   sudo ln -s /etc/nginx/sites-available/nusantartrans /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Jalankan aplikasi (Gunicorn):
#   cd /var/www/website-pemesanan-bus
#   python -m venv .venv && source .venv/bin/activate
#   pip install -r requirements.txt
#   python manage.py migrate && python manage.py compile_i18n
#   python manage.py collectstatic --noinput
#   gunicorn core.wsgi:application --bind 127.0.0.1:8001 --workers 3
# =============================================================================

upstream nusantartrans_app {
    server 127.0.0.1:8001;
}

server {
    listen 80;
    listen [::]:80;
    server_name nusantartrans.example www.nusantartrans.example;  # ganti domain Anda

    # ===== Core Web Vitals: kompresi & caching =====
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/woff2;
    gzip_min_length 512;
    open_file_cache max=1000 inactive=1h;

    client_max_body_size 10M;

    # ---------- Berkas statik (WhiteNoise collectstatic: .gz siap pakai) ----------
    location /static/ {
        alias /var/www/website-pemesanan-bus/staticfiles/;
        gzip_static on;          # sajikan berkas .gz hasil collectstatic
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------- Media unggahan (bukti bayar, foto mobil) ----------
    location /media/ {
        alias /var/www/website-pemesanan-bus/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---------- Aplikasi Django ----------
    location / {
        proxy_pass http://nusantartrans_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }

    # ---------- Berkas yang tidak perlu di-expose ----------
    location ~ /\.(?!well-known) {
        deny all;
    }

    # ---- Untuk HTTPS, sertakan blok berikut (Let's Encrypt / certbot) ----
    # listen 443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/nusantartrans.example/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/nusantartrans.example/privkey.pem;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # add_header X-Content-Type-Options "nosniff" always;
    # add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
